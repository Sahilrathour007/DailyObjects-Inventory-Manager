<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stock Placement Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="row"><h1>Stock Placement Planner</h1><div class="views" id="views" role="group" aria-label="View"></div></div>
      <div class="row" id="status"></div>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
  </div>
</header>
<div class="wrap"><main id="main"></main></div>
<div id="overlay"></div>
<input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden>

<script src="app.js"></script>
</body>
</html>
